name: Deploy API to Cloudflare Workers

# Deploys on merge to main, but the "production" environment requires a
# reviewer, so nothing publishes until it is approved. Manual runs default to
# a dry run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npx wrangler deploy --dry-run
      - name: Deploy
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx wrangler deploy
